name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q cosmic_ray_rate.py generate_artifacts.py

      - name: Run tests
        run: python -m pytest

      - name: Verify generated LaTeX fragments
        run: |
          python generate_artifacts.py
          git diff --exit-code -- generated_approximation.tex generated_rate_table.tex

      - name: Smoke-test CLI
        run: python cosmic_ray_rate.py 1e15 --check-formula --check-points 1001
